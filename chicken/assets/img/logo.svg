      <stop stop-color="#FF8A1F"/>
      <stop offset="0.55" stop-color="#E85D04"/>
      <stop offset="1" stop-color="#C44A00"/>
    </linearGradient>
    <linearGradient id="comb" x1="40" y1="10" x2="62" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A1A"/>
      <stop offset="1" stop-color="#D43800"/>
